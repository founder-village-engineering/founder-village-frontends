minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "fv-provider-token-prefix"
description = "Prefixed GitHub or Cloudflare credential"
regex = '''\b(?:gh[pousr]_|github_pat_|cfut_)[A-Za-z0-9_-]{24,}\b'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_", "cfut_"]

[[rules]]
id = "fv-private-key-header"
description = "Private key export header"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]

[[rules]]
id = "fv-literal-env-credential"
description = "Literal value in a credential environment variable"
regex = '''(?m)^[ \t]*(?:export[ \t]+)?(?:[A-Z0-9]+_)*(?:PASSWORD|PASSWD|TOKEN|API_KEY|ACCESS_KEY|PRIVATE_KEY|SIGNING_KEY|HMAC_KEY|SECRET(?:_KEY)?)[ \t]*=[ \t]*(?:"([^"\r\n$<>]+)"|'([^'\r\n$<>]+)'|([^\s"'$<>\x60\[\]{},;#]+))[ \t]*(?:#.*)?\r?$'''
keywords = ["password", "passwd", "token", "key", "secret"]

[[rules]]
id = "fv-literal-app-credential"
description = "Literal password, key, client secret, or session token in application code"
regex = '''(?i)\b(?:[a-z0-9]+_)*(?:password|passwd|(?:api|private|signing|access)[_-]?key|(?:(?:client|webhook)[_-]?)?secret|(?:(?:auth|access|refresh|bearer|id)[_-]?)?token)["']?\s*(?::\s*string\s*=|[:=])\s*["'\x60]([^"'\x60$\r\n<>]+)["'\x60]'''
keywords = ["password", "passwd", "key", "secret", "token"]

# These values are only used by the named local test fixtures.
[[rules.allowlists]]
condition = "AND"
paths = ['''^apps/founder-food-deliveries/src/App\.test\.tsx$''', '''^tests/e2e/food-deliveries\.spec\.ts$''']
regexes = ['''^synthetic$''']

[[rules.allowlists]]
condition = "AND"
paths = ['''^packages/frontend-platform/src/api\.test\.ts$''']
regexes = ['''^synthetic-token$''']

[[rules.allowlists]]
condition = "AND"
paths = ['''^tests/e2e/members\.spec\.ts$''']
regexes = ['''^synthetic-access-token$''']

[[rules]]
id = "fv-inline-url-credential"
description = "Literal password embedded in a service URL"
regex = '''(?i)\b(?:postgres(?:ql)?|amqps?|rediss?|mysql|mongodb(?:\+srv)?|https?)://[^\s:/@?#${}<>"'\\]+:([^\s/@?#${}<>"'\\]+)@'''
secretGroup = 1
keywords = ["://"]

[[rules]]
id = "fv-inline-auth-credential"
description = "Literal HTTP authorization or package registry credential"
regex = '''(?im)(?:["'](?:authorization:[ \t]*)?(?:bearer|basic)[ \t]+([a-z0-9._~+/=-]+)["']|^[ \t]*(?://[^\r\n=]+:)?_(?:authToken|auth|password)[ \t]*=[ \t]*["']?([a-z0-9._~+/=-]+)["']?[ \t]*\r?$)'''
keywords = ["bearer", "basic", "_auth", "_password"]

[[rules.allowlists]]
condition = "AND"
paths = ['''^packages/frontend-platform/src/api\.test\.ts$''']
regexes = ['''^synthetic-token$''']
